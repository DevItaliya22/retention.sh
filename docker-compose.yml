# Local PostgreSQL for development (latency testing, etc.)
# Start: docker compose up -d
# Stop:  docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: dy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dy
    ports:
      - "5433:5432"
    volumes:
      - dy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dy-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - dy_redis_data:/data

volumes:
  dy_postgres_data:
  dy_redis_data:
