# Local PostgreSQL for development (latency testing, etc.)
# Start: docker compose up -d
# Stop:  docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: dy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dy
    ports:
      - "5432:5432"
    volumes:
      - dy_postgres_data:/var/lib/postgresql/data

volumes:
  dy_postgres_data:
